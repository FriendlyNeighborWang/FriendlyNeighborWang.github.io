# Rendererer theme defaults. Site-level hugo.yaml overrides any of these.

[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)'], ['$', '$']]

[markup.highlight]
  noClasses = false

[module.hugoVersion]
  extended = true
  min = "0.146.0"
