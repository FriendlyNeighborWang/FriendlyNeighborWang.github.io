# GitHub Actions: Hugo → GitHub Pages 部署
# 触发：push 到 main 分支，或手动在 Actions 页面点 "Run workflow"
# 流程：装 Hugo → checkout 含 submodule（PaperMod 主题）→ hugo build → 部署 Pages
# 参考：https://gohugo.io/host-and-deploy/host-on-github-pages/

name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:    # 允许手动触发，调试用

# 工作流需要的 GH 权限：读仓库 / 写 Pages / 申请 OIDC token
permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署，避免新 push 把旧的覆盖到一半
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.140.2     # 想升级 Hugo 改这里就行
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Install Dart Sass
        run: sudo snap install dart-sass

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive   # 主题作为 submodule 必须递归 checkout
          fetch-depth: 0          # 全历史，让 Hugo 能用 git 信息（如 lastmod）

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
