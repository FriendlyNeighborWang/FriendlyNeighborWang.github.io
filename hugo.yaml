# Hugo 站点配置 · Blowfish 主题
# Blowfish 文档: https://blowfish.page/docs/configuration/
#
# 这一版只是把 Blowfish 默认效果跑起来；下一阶段（B++）才叠 Terminal 配色 +
# Hugoplate 斜分割 hero。所以现在 colorScheme 仍是 blowfish 自带的默认值。

# ============================================================================
# 站点基础信息
# ============================================================================
baseURL: "https://friendlyneighborwang.github.io/"
defaultContentLanguage: "en"
languageCode: "en"
title: "Rendererer"
theme: "blowfish"
# 让 Hugo 把每个 CJK 字符算作一个词，不再用空白切词（默认行为对中文会把
# 一整段算成 1 个词，造成 .WordCount 偏小）
hasCJKLanguage: true

# ============================================================================
# 构建行为
# ============================================================================
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true

# 文章 .Date 字段的取值优先级：先用文件 mtime（编辑保存就更新），找不到再
# 回落到 frontmatter 的 date 字段。模板里渲染 .Date 的地方就会显示最后修改
# 时间，不需要每次手动改 frontmatter。
frontmatter:
  date:
    - ":fileModTime"
    - date
enableInlineShortcodes: true

pagination:
  pagerSize: 10

minify:
  disableXML: true
  minifyOutput: true
  tdewolff:
    html:
      # 默认 minifier 会把文本里的 \t 压成单个空格，导致正文里的 tab 缩进
      # 全部丢失。开 keepWhitespace 让 minifier 不动文本节点里的空白。
      # extend-footer.html 的 JS 会负责把 \t 换成 4ch 宽的 <span class="md-tab">。
      keepWhitespace: true

# ============================================================================
# 永久链接（让文章 URL 是 /posts/<slug> 形式，不带年月日，更清爽）
# ============================================================================
permalinks:
  posts: "/posts/:slug/"
  series: "/series/:slug/"

# ============================================================================
# Taxonomy（分类体系）
# Blowfish 内置 series（系列文）的概念，比 PaperMod 多
# ============================================================================
taxonomies:
  tag: tags
  category: categories
  series: series

# ============================================================================
# 输出格式（搜索功能要 JSON）
# ============================================================================
outputs:
  home:
    - HTML
    - RSS
    - JSON

# ============================================================================
# Markdown 渲染
# ============================================================================
markup:
  goldmark:
    renderer:
      unsafe: true
      hardWraps: true   # 单个换行渲染成 <br>，支持 shift+enter 的软换行
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: monokai
  tableOfContents:
    startLevel: 1
    endLevel: 4

# ============================================================================
# 顶部导航菜单
# ============================================================================
# Blowfish 把 menu 配置和 hugo 标准位置一致；不需要单独 menus.toml
# 我移除了"归档"——Blowfish 没有原生 archive 布局，/posts/ 卡片视图本身就是
# 最直观的归档。如果以后真需要按年分组，再加。
menu:
  main:
    - identifier: posts
      name: Posts
      pageRef: posts
      weight: 10
    - identifier: tags
      name: Tags
      pageRef: tags
      weight: 20
    - identifier: about
      name: About
      pageRef: about
      weight: 30

# ============================================================================
# Blowfish 主题参数
# ============================================================================
params:
  # --- 主题外观 ---
  colorScheme: "terminal-amber"  # 自定义方案，定义在 assets/css/schemes/terminal-amber.css
  defaultAppearance: "dark"    # 仅 dark
  autoSwitchAppearance: false  # 不跟随系统切换；右上角的明暗切换按钮也不显示

  # --- 全局功能 ---
  enableSearch: true           # 启用站内搜索（路由 /search/，主题自动生成）
  enableCodeCopy: true         # 代码块右上角复制按钮

  # mainSections 决定首页"最近文章"和搜索索引来源；这里只有 posts
  mainSections:
    - posts

  # 不显示带 image 的文章 cover 时的占位图
  defaultBackgroundImage: ""
  defaultFeaturedImage: ""

  # 高亮的目录里 lineNos 是否单独的列（节省宽度时关掉）
  highlightCurrentMenuArea: true
  smartTOC: true                # 阅读时自动展开当前章节
  smartTOCHideUnfocusedChildren: false

  # --- 首页 ---
  homepage:
    layout: "custom"           # 使用我们写的 layouts/partials/home/custom.html (斜分割 hero)
                               # 备选: profile / hero / page / background
    homepageImage: ""          # 头像 / 主图（放 assets/img/ 后填路径）
    showRecent: true
    showRecentItems: 6
    showMoreLink: true
    showMoreLinkDest: "/posts/"
    cardView: true             # 最近文章用卡片网格展示
    cardViewScreenWidth: false # true = 卡片撑满屏宽；false = 限制最大宽度
    layoutBackgroundBlur: false

  # --- 文章页（单篇） ---
  article:
    showDate: true
    showViews: false           # 需要外接 Firebase 才能显示访问数；先关
    showLikes: false
    showDateOnlyInArticle: false
    showDateUpdated: false
    showAuthor: false          # 关掉文章头的 AUTHOR 卡片（名字 + bio）
    showHero: false            # 文章页顶部大图；先关，需要时打开
    heroStyle: "basic"         # basic / big / background / thumbAndBackground
    layoutBackgroundBlur: false
    layoutBackgroundHeaderSpace: true
    showBreadcrumbs: true
    showDraftLabel: true
    showEdit: false            # 暂关；GH repo 稳定后可开
    showHeadingAnchors: true
    showPagination: true
    invertPagination: false    # false = 上一篇在左、下一篇在右
    showReadingTime: true
    showTableOfContents: true
    showTaxonomies: true
    showAuthorBottom: false
    showWordCount: true
    showSummary: false
    showZenMode: false
    sharingLinks: []           # 空 = 不显示分享按钮（可加 ["x", "linkedin", "facebook"] 等）

  # --- 列表页（如 /posts/、/tags/xxx/） ---
  list:
    showHero: false
    heroStyle: "background"
    showBreadcrumbs: false
    showSummary: true
    showViews: false
    showLikes: false
    showTableOfContents: false
    showCards: true            # 关键：列表用卡片网格而非简单列表
    orderByWeight: false
    groupByYear: false         # 不按年份分组（卡片视图下分组会变丑）
    cardView: true             # 同时设这两个保险（不同 Blowfish 版本字段名有差异）
    cardViewScreenWidth: false
    constrainItemsWidth: false

  # --- 标签 / 分类聚合页 ---
  taxonomy:
    showTermCount: true
    showHero: false
    heroStyle: "background"
    showBreadcrumbs: false
    showViews: false
    showLikes: false
    showTableOfContents: false
    cardView: false

  # --- 单个标签 / 分类的文章列表 ---
  term:
    showHero: false
    heroStyle: "background"
    showBreadcrumbs: true
    showViews: false
    showLikes: false
    showTableOfContents: true
    groupByYear: true
    cardView: true
    cardViewScreenWidth: false

  # --- 页脚 ---
  footer:
    showCopyright: true
    showThemeAttribution: true
    showAppearanceSwitcher: false   # 不显示明暗切换
    showScrollToTop: true

  # --- SEO / 元数据 ---
  description: "Notes on UE engine internals, graphics, and rendering."
  keywords:
    - Unreal Engine
    - Graphics
    - Rendering
    - Vulkan
    - C++
  author:
    name: "Rendererer"
    headline: "UE Graphics / Rendering / Engine"
    bio: "Vulkan KHR ray tracing project under my belt; currently doing source-level deep dives into UE reflection / GC / Gameplay."
    image: ""
    links:
      - github: "https://github.com/FriendlyNeighborWang"
      - zhihu: "https://www.zhihu.com/people/joker-97-19-55"
