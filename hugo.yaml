# Hugo 站点配置 · PaperMod 主题
# 完整变量参考: https://github.com/adityatelange/hugo-PaperMod/wiki/Variables
#
# 这个文件是你网站的"控制面板"。改动它通常需要 Ctrl+C 关掉 hugo server 再
# 重启才能彻底生效（个别项 hugo server 会热加载，但 baseURL/theme 这种不会）。

# ============================================================================
# 站点基础信息
# ============================================================================
baseURL: "https://friendlyneighborwang.github.io/"   # 上线后换成自定义域名（如 https://wangshihan.dev/）
title: "Wang Sihan / 王思涵"                          # 浏览器标签 + 站点标题
theme: "PaperMod"                                     # 用 themes/PaperMod 这个主题
languageCode: "zh-CN"                                 # 影响 RSS / sitemap 的 lang 标签
defaultContentLanguage: "zh"

# ============================================================================
# 构建行为
# ============================================================================
enableRobotsTXT: true        # 生成 robots.txt 让搜索引擎抓取
buildDrafts: false           # 默认不输出 draft: true 的文章（写不完别让别人看到）
buildFuture: false           # 不输出未来日期的文章
buildExpired: false          # 不输出已过期的文章（front matter 有 expiryDate）
enableEmoji: true            # MD 里写 :smile: 会被解析成 😄
enableInlineShortcodes: true # 允许 {{< shortcode >}} 内联用法

# ============================================================================
# 分页
# ============================================================================
pagination:
  pagerSize: 10              # 列表页每页几篇文章

# ============================================================================
# 压缩输出（部署时减少传输体积）
# ============================================================================
minify:
  disableXML: true           # XML 压缩工具有时把 RSS 搞坏，先关
  minifyOutput: true         # HTML/CSS/JS 仍会压缩

# ============================================================================
# 顶部导航菜单
# ============================================================================
# weight 控制顺序（小的在左）。url 是 / 开头的站内绝对路径。
# 任何菜单项要能跳过去，content/ 下必须有对应的 .md 文件或 section（比如 posts/）
menu:
  main:
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 10
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 20
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 30
    - identifier: search
      name: 搜索
      url: /search/
      weight: 40
    - identifier: about
      name: 关于
      url: /about/
      weight: 50

# ============================================================================
# 输出格式
# ============================================================================
# 主页除了 HTML 还输出 JSON——这是 PaperMod 客户端搜索（Fuse.js）所需的索引数据。
# RSS 给订阅器用。
outputs:
  home:
    - HTML
    - RSS
    - JSON

# ============================================================================
# Markdown 渲染设置
# ============================================================================
markup:
  goldmark:
    renderer:
      unsafe: true           # 允许 MD 里写裸 HTML（某些 shortcode 和 KaTeX 需要）
  highlight:                 # 代码块高亮（用 Hugo 内置的 chroma 引擎）
    noClasses: false         # 用 CSS 类而非 inline style，便于明暗主题切换
    codeFences: true         # 支持 ```lang 这种围栏代码块
    guessSyntax: true        # 没指定语言时自动猜
    lineNos: false           # 默认不显示行号；个别文章想要可在 front matter 加
    style: monokai           # 配色方案（chroma 内置约 80 种，可以换 dracula / github 等）
  tableOfContents:
    startLevel: 2            # 目录从 ## 二级标题开始（一级 # 通常是文章标题本身）
    endLevel: 4              # 到 #### 四级停

# ============================================================================
# PaperMod 主题参数（params 下的每一项都是 PaperMod 自己定义的）
# ============================================================================
params:
  env: production            # production 启用一些性能优化和外部服务接入
  description: "UE 引擎 / 图形 / 渲染 学习与工程笔记"
  keywords: [Unreal Engine, Graphics, Rendering, Vulkan, C++]
  author: "Wang Sihan"

  # --- 颜色与主题切换 ---
  defaultTheme: auto         # auto 跟随系统 / light / dark
  disableThemeToggle: false  # false = 显示右上角的明暗切换按钮

  # --- 文章页功能开关（每一条都是单独的 UI 元素，可独立开关） ---
  ShowReadingTime: true            # 显示预估阅读时间
  ShowShareButtons: false          # 文末分享到推/FB 等按钮（个人技术博客用处不大）
  ShowPostNavLinks: true           # 文末"上一篇 / 下一篇"
  ShowBreadCrumbs: true            # 顶部"首页 › posts › 文章名"路径
  ShowCodeCopyButtons: true        # 代码块右上角"复制"按钮
  ShowToc: true                    # 文章右侧目录
  TocOpen: false                   # 目录默认折叠（true = 默认展开）
  ShowWordCount: true              # 显示字数
  ShowFullTextinRSS: true          # RSS 输出全文而非摘要（订阅者体验更好）
  ShowRssButtonInSectionTermList: true   # 标签页 / 分类页加 RSS 按钮

  # --- 首页样式 ---
  # PaperMod 首页有两种模式：
  #   1) profileMode：中心头像 + 简介 + 几个跳转按钮，类似 landing page
  #   2) posts list（默认）：直接列出最新文章
  # 我先开 profileMode 给你看效果。如果想改成列表式：把 enabled 改 false。
  profileMode:
    enabled: true
    title: "Wang Sihan / 王思涵"
    subtitle: |
      UE 图形 / 渲染 / 引擎方向。Vulkan KHR 光线追踪项目；
      正在源码级深挖 UE 反射 / GC / Gameplay 基础。
      这里发技术性长文，节奏不快，但每篇尽量扛得住 3 层追问。
    imageUrl: ""             # 头像地址（放 static/images/avatar.jpg 后填 "/images/avatar.jpg"）
    imageWidth: 120
    imageHeight: 120
    imageTitle: avatar
    buttons:
      - name: 文章
        url: /posts/
      - name: 归档
        url: /archives/
      - name: 标签
        url: /tags/

  # 如果你想关掉 profileMode、改用 posts list 首页，把上面的 enabled 设 false，
  # 然后启用下面这块（写在主页文章列表上方的简介条）：
  # homeInfoParams:
  #   Title: "👋 Hi, I'm Wang Sihan"
  #   Content: 一两句自我介绍...

  # --- 社交图标（左下角链接图标） ---
  # PaperMod 内置 60+ 图标，name 字段必须是它支持的。完整列表见主题 wiki。
  socialIcons:
    - name: github
      url: "https://github.com/FriendlyNeighborWang"
    # - name: linkedin
    #   url: "https://www.linkedin.com/in/<your-id>"
    # - name: email
    #   url: "mailto:you@domain.com"
    # - name: rss
    #   url: "/index.xml"

  # --- 搜索（基于 Fuse.js 客户端模糊搜索） ---
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4           # 0 = 精确匹配，1 = 全模糊；0.4 是平衡值
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

  # --- 资源加载控制 ---
  assets:
    disableHLJS: true        # 不加载 highlight.js（用 Hugo 内置 chroma 即可）
    disableFingerprinting: false  # CSS/JS 加 hash 后缀，部署后浏览器缓存能正确刷新
    favicon: ""              # 后续放 static/favicon.ico 后填 "/favicon.ico"
    apple_touch_icon: ""

  # --- 文章封面图全局默认 ---
  # 单篇文章可在 front matter 用 cover: { image: "..." } 单独指定
  cover:
    hidden: false
    hiddenInList: false      # 列表页是否隐藏封面
    hiddenInSingle: false    # 文章页是否隐藏封面
    responsiveImages: true

  # --- "在 GitHub 上编辑此页"链接 ---
  # 让读者可以一键提 PR 修错别字。指向你的 content/ 目录在 GH 上的位置。
  editPost:
    URL: "https://github.com/FriendlyNeighborWang/FriendlyNeighborWang.github.io/edit/main/content"
    Text: "在 GitHub 上编辑"
    appendFilePath: true     # 自动拼上文件相对路径

  # --- 评论（giscus，后续启用） ---
  # comments: true
  # 启用后还要在 layouts/partials/comments.html 配 giscus repo 等参数；
  # 等本地预览跑通、域名定下来再做这步。

  # --- 数学公式（KaTeX） ---
  math: true                 # 仅是开关；要真渲染还需补 layouts/partials/extend_head.html
                             # 引入 KaTeX 资源——等你写第一篇含公式的文时我再加。
